<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" width="50" height="50">
  <!-- Kern Logo - "Essential Point" design: concentric rings + solid core -->
  <!-- Color: #ff6600 (Kern orange) -->

  <!-- Outer ring -->
  <circle cx="25" cy="25" r="24.625" fill="none" stroke="#ff6600" stroke-width="0.625"/>

  <!-- Inner ring (63% diameter) -->
  <circle cx="25" cy="25" r="14.5" fill="none" stroke="#ff6600" stroke-width="1.25"/>

  <!-- Core (33% diameter, solid) -->
  <circle cx="25" cy="25" r="8.25" fill="#ff6600"/>
</svg>
